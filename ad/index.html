<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CASIO Arabic Dial — Spot 33s</title>
<style>
@font-face{font-family:Archivo;src:url(fonts/Archivo.ttf) format('truetype');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Kufi;src:url(fonts/ReemKufi.ttf) format('truetype');font-weight:400 700}
@font-face{font-family:Amiri;src:url(fonts/Amiri-Bold.ttf) format('truetype');font-weight:700}
@font-face{font-family:Ruqaa;src:url(fonts/ArefRuqaa-Bold.ttf) format('truetype');font-weight:700}

:root{--W:1920px;--H:1080px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body.preview{display:grid;place-items:center;height:100vh}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;perspective:2200px;
  font-family:Archivo,sans-serif;color:#fff;transform-origin:0 0}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden;perspective:2200px}
.fill{position:absolute;inset:0}

/* backgrounds */
.bg{position:absolute;inset:-60px;background:radial-gradient(ellipse 70% 75% at var(--gx,50%) var(--gy,48%),var(--c1),var(--c2) 78%)}
.relief{position:absolute;inset:-200px;background:url(img/relief.png) repeat;background-size:1600px 1000px;opacity:var(--ro,.9);
  -webkit-mask-image:radial-gradient(circle var(--lr,900px) at var(--lx,50%) var(--ly,50%),#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.18) 100%);
          mask-image:radial-gradient(circle var(--lr,900px) at var(--lx,50%) var(--ly,50%),#000 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.18) 100%)}
.relief.r2{background-image:url(img/relief_r.png)}
.glow{position:absolute;inset:0;background:radial-gradient(circle 700px at var(--lx,50%) var(--ly,50%),var(--gl,rgba(255,255,255,.12)),transparent 70%);mix-blend-mode:screen}

/* watch */
.watch{position:absolute;left:0;top:0;transform-style:flat}
.watch img.w{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(18px 34px 34px rgba(0,0,0,.55))}
.watch.fade img.w{-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 15%,#000 85%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 15%,#000 85%,transparent 100%)}
.watch .sheen{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.95;
  background:linear-gradient(108deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.95) 49%,rgba(255,255,255,.95) 51%,rgba(255,255,255,0) 62%);
  background-size:300% 100%;background-repeat:no-repeat;background-position:var(--sx,130%) 0;
  -webkit-mask-size:100% 100%;mask-size:100% 100%}
.watch svg.sec{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 6px 3px rgba(0,0,0,.35))}
.daywin{position:absolute;overflow:hidden;background:linear-gradient(#f4f4f2,#e4e4e1);border-radius:2px}
.daywin .strip{position:absolute;left:0;right:0;top:0}
.daywin .strip div{display:flex;align-items:center;justify-content:center;color:#111;font-weight:700}

/* type */
.mask{display:block;overflow:hidden;padding:.04em .02em}
.mask>span{display:inline-block}
.ch{display:inline-block;will-change:auto}
.xl{font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.86;letter-spacing:-.01em}
.lbl{font-weight:600;font-stretch:110%;letter-spacing:.38em;text-transform:uppercase;font-size:22px}
.ar{font-family:Kufi;font-weight:600;direction:rtl}
.num{position:absolute;font-family:Amiri;font-weight:700;line-height:1;white-space:nowrap;
  background:linear-gradient(165deg,#fff 0%,#c9ced3 20%,#7b838b 42%,#f1f3f5 56%,#8c949c 76%,#e2e6e9 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.45)) drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.num.blue{background:linear-gradient(165deg,#5aa8ea 0%,#1d63a8 38%,#4a98dc 58%,#123f72 100%);-webkit-background-clip:text;background-clip:text}
.num.ghost{filter:none;opacity:.16}
.metal{background:linear-gradient(170deg,#fff 0%,#dfe3e7 35%,#8f979f 52%,#f5f7f8 66%,#aab2b9 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* overlays */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#leak{position:absolute;inset:-20%;opacity:0;mix-blend-mode:screen;pointer-events:none;
  background:radial-gradient(ellipse 40% 60% at 30% 40%,rgba(120,180,255,.55),transparent 70%),radial-gradient(ellipse 35% 50% at 75% 60%,rgba(255,255,255,.4),transparent 70%)}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 75% at 50% 50%,transparent 58%,rgba(0,0,0,.42) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;background:url(img/grain.png);opacity:.07;mix-blend-mode:overlay}
.scrim{position:absolute;pointer-events:none}
.dof{position:absolute;inset:0;pointer-events:none;-webkit-backdrop-filter:blur(var(--db,7px));backdrop-filter:blur(var(--db,7px));
  -webkit-mask-image:radial-gradient(ellipse 52% 50% at var(--fx,50%) var(--fy,50%),transparent 45%,#000 100%);
          mask-image:radial-gradient(ellipse 52% 50% at var(--fx,50%) var(--fy,50%),transparent 45%,#000 100%)}
.rule{position:absolute;height:2px;background:currentColor;transform-origin:0 50%}
.callout{position:absolute;overflow:visible}
.glass{position:absolute;border-radius:999px;background:rgba(8,12,20,.38);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.22)}
#hud{position:fixed;left:12px;bottom:10px;color:#888;font:12px monospace;z-index:9}
</style>
</head>
<body>
<div id="stage"><div id="cam" class="fill">

  <!-- S0 · INTRO : the dial is written, numeral by numeral, tick by tick -->
  <section class="scene" id="s0" style="--c1:#121417;--c2:#030304;visibility:visible">
    <div class="bg"></div><div class="relief" style="--ro:.55"></div><div class="glow"></div>
    <div id="ring" style="position:absolute;left:960px;top:540px;width:0;height:0">
      <svg id="ringsvg" width="1000" height="1000" viewBox="-500 -500 1000 1000" style="position:absolute;left:-500px;top:-500px;overflow:visible">
        <defs><linearGradient id="gSil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#9aa2aa"/><stop offset="1" stop-color="#eef1f3"/></linearGradient></defs>
        <circle id="track" r="420" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
        <g id="minutes"></g>
        <g id="ringhand"><rect x="-3" y="-400" width="6" height="470" rx="3" fill="url(#gSil)"/><circle r="15" fill="#d9dde1"/><circle r="5" fill="#7c848c"/></g>
      </svg>
      <div id="ringnums"></div>
    </div>
  </section>

  <!-- S1 · HERO black -->
  <section class="scene" id="s1" style="--c1:#26282c;--c2:#050506">
    <div class="bg"></div><div class="relief" style="--ro:.8"></div><div class="glow" style="--gl:rgba(255,255,255,.10)"></div>
    <div id="heroText" style="position:absolute;left:110px;top:285px">
      <div class="xl" style="font-size:150px"><span class="mask"><span id="hA">ARABIC</span></span></div>
      <div class="xl" style="font-size:150px"><span class="mask"><span id="hB">DIAL</span></span></div>
      <div style="margin-top:34px;display:flex;align-items:center;gap:26px">
        <div class="rule" id="hRule" style="position:relative;width:90px;color:#cfd4d8"></div>
        <div class="lbl" id="hC" style="color:#d6dadd">Collection</div>
      </div>
      <div class="ar" id="hD" style="font-size:46px;margin-top:18px;color:#c3c9ce;text-align:left">مجموعة الأرقام العربية</div>
    </div>
    <div class="idx" id="i1" style="position:absolute;left:120px;bottom:80px;display:flex;align-items:baseline;gap:22px">
      <span style="font-family:Amiri;font-size:64px" class="metal">٠١</span><span class="lbl" style="color:#e9ecee">Black</span><span class="ar" style="font-size:30px;color:#aab1b7">أسود</span>
    </div>
  </section>

  <!-- S2 · colour run -->
  <section class="scene" id="p_royal" style="--c1:#2a51b8;--c2:#06154a"></section>
  <section class="scene" id="p_teal"  style="--c1:#1f9cbd;--c2:#043d50"></section>
  <section class="scene" id="p_ice"   style="--c1:#e1f0f6;--c2:#86adbf"></section>
  <section class="scene" id="p_silver" style="--c1:#fbfbfc;--c2:#b3bac1"></section>

  <!-- S4 · features -->
  <section class="scene" id="f1" style="--c1:#2a51b8;--c2:#06154a"></section>
  <section class="scene" id="f2" style="--c1:#1f9cbd;--c2:#043d50"></section>
  <section class="scene" id="f3" style="--c1:#26282c;--c2:#050506"></section>
  <section class="scene" id="f4" style="--c1:#e1f0f6;--c2:#86adbf"></section>

  <!-- S5 · line-up -->
  <section class="scene" id="lineup" style="background:#000"><div id="lu" class="fill"></div></section>

  <!-- S6 · rapid macro cuts -->
  <section class="scene" id="m1" style="--c1:#26282c;--c2:#050506"></section>
  <section class="scene" id="m2" style="--c1:#2a51b8;--c2:#06154a"></section>
  <section class="scene" id="m3" style="--c1:#1f9cbd;--c2:#043d50"></section>
  <section class="scene" id="m4" style="--c1:#e1f0f6;--c2:#86adbf"></section>

  <!-- S7 · Arabic tagline -->
  <section class="scene" id="tag" style="--c1:#ffffff;--c2:#b9c0c7"></section>

  <!-- S8 · end card -->
  <section class="scene" id="end" style="--c1:#1b1d21;--c2:#030304"></section>

  </div>
  <div id="leak"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="flash"></div>
  <div id="black"></div>
</div>
<div id="hud"></div>

<script src="vendor/gsap.min.js"></script>
<script src="data.js"></script>
<script>
'use strict';
/* =====================================================================
   CASIO · Arabic Dial (MTP-E735AR) — 33 s spec spot
   Edit grid: 120 BPM → beat = 0.5 s, bar = 2 s (shared with tools/music.py)
   Everything is a pure function of time: window.seek(t) renders frame t.
   ===================================================================== */
const BEAT = 0.5, DUR = 33.0, S3 = 3;          // S3: watch PNGs are 3× the cut-out geometry
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const W = window.WATCH;
const COL = {
  black:  { c1:'#26282c', c2:'#050506', dark:true,  name:'Black',      ar:'أسود',        hand:'#e7eaed' },
  royal:  { c1:'#2a51b8', c2:'#06154a', dark:true,  name:'Royal Blue', ar:'أزرق ملكي',   hand:'#e7eaed' },
  teal:   { c1:'#1f9cbd', c2:'#043d50', dark:true,  name:'Teal',       ar:'أزرق بترولي', hand:'#e7eaed' },
  ice:    { c1:'#e1f0f6', c2:'#86adbf', dark:false, name:'Ice Blue',   ar:'أزرق جليدي',  hand:'#c9d1d6' },
  silver: { c1:'#fbfbfc', c2:'#b3bac1', dark:false, name:'Silver',     ar:'فضي',         hand:'#1f6aab' },
};
const ORDER = ['black', 'royal', 'teal', 'ice', 'silver'];
const tl = gsap.timeline({ paused: true });
const frameHooks = [];        // per-frame functions f(t)
const watches = [];           // every watch instance (for ticking)

/* ---------- helpers ---------------------------------------------------- */
function bgLayers(scene, opts = {}) {
  el('div', 'bg', scene);
  const r = el('div', 'relief' + (opts.r2 ? ' r2' : ''), scene); if (opts.ro != null) r.style.setProperty('--ro', opts.ro);
  const g = el('div', 'glow', scene); if (opts.gl) g.style.setProperty('--gl', opts.gl);
  return { relief: r, glow: g };
}
function makeWatch(name, parent, opts = {}) {
  const d = W[name];
  const w = el('div', 'watch' + (opts.fade ? ' fade' : ''), parent);
  const Wpx = d.w * S3, Hpx = d.h * S3, cx = d.cx * S3, cy = d.cy * S3;
  w.style.width = Wpx + 'px'; w.style.height = Hpx + 'px';
  w.style.transformOrigin = `${cx}px ${cy}px`;
  const img = el('img', 'w', w); img.src = `img/watch_${name}.png`;
  // live seconds hand (the printed one was removed from the photo)
  const L = d.tip * S3 + 4, col = COL[name].hand;
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'sec'); s.setAttribute('viewBox', `0 0 ${Wpx} ${Hpx}`);
  const dark = name === 'silver' ? '#0f3f6e' : '#7d868e';
  s.innerHTML = `<defs><linearGradient id="hg_${name}_${watches.length}" x1="0" x2="1"><stop offset="0" stop-color="${dark}"/><stop offset=".5" stop-color="${col}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs>
    <g class="hand" transform="rotate(216 ${cx} ${cy})">
      <polygon points="${cx - 4.2},${cy + 34} ${cx + 4.2},${cy + 34} ${cx + 1.6},${cy - L} ${cx - 1.6},${cy - L}" fill="url(#hg_${name}_${watches.length})"/>
      <circle cx="${cx}" cy="${cy}" r="10" fill="${col}"/><circle cx="${cx}" cy="${cy}" r="10" fill="none" stroke="${dark}" stroke-width="1.5" opacity=".6"/>
      <circle cx="${cx}" cy="${cy}" r="3.2" fill="${dark}"/>
    </g>`;
  w.appendChild(s);
  const sh = el('div', 'sheen', w);
  sh.style.webkitMaskImage = sh.style.maskImage = `url(img/watch_${name}.png)`;
  if (!COL[name].dark) { sh.style.mixBlendMode = 'screen'; sh.style.opacity = .5; }
  const rec = { el: w, name, d, cx, cy, hand: s.querySelector('.hand'), sheen: sh, offset: opts.offset || 0, scene: parent.closest('.scene') };
  watches.push(rec);
  return rec;
}
// transform so that point p (cut-out px coords; default pivot) lands on screen (X,Y) at scale s
function at(rec, X, Y, s, p) {
  const px = p ? p[0] * S3 : rec.cx, py = p ? p[1] * S3 : rec.cy;
  return { x: X - rec.cx - s * (px - rec.cx), y: Y - rec.cy - s * (py - rec.cy), scale: s };
}
function sheen(rec, t, dur = 0.8, from = 130, to = -30) {
  tl.fromTo(rec.sheen, { '--sx': from + '%' }, { '--sx': to + '%', duration: dur, ease: 'power2.inOut' }, t);
}
function split(node) {
  const txt = node.textContent; node.textContent = '';
  return [...txt].map(c => { const s = el('span', 'ch', node); s.textContent = c === ' ' ? ' ' : c; return s; });
}
function show(sel, t0, t1) {           // scene visibility window
  tl.set(sel, { visibility: 'visible' }, t0);
  if (t1 != null) tl.set(sel, { visibility: 'hidden' }, t1);
}
function flash(t, a = .85, d = .35, color = '#fff') {
  tl.set('#flash', { background: color }, t - 0.001);
  tl.fromTo('#flash', { opacity: a }, { opacity: 0, duration: d, ease: 'power2.out', immediateRender: false }, t);
}
function lightPath(scene, t0, t1, x0, y0, x1, y1, ease = 'sine.inOut') {
  tl.fromTo(scene, { '--lx': x0 + '%', '--ly': y0 + '%' }, { '--lx': x1 + '%', '--ly': y1 + '%', duration: t1 - t0, ease, immediateRender: false }, t0);
}
function idxLabel(parent, n, name, light) {
  const c = light ? '#0e2a4a' : '#eef1f3', c2 = light ? '#36536f' : '#b4bbc1';
  const g = el('div', '', parent, `<span style="font-family:Amiri;font-size:64px;color:${c}">${AR('0' + n)}</span><span class="lbl" style="color:${c}">${COL[ORDER[n - 1]].name}</span><span class="ar" style="font-size:30px;color:${c2}">${COL[ORDER[n - 1]].ar}</span>`);
  Object.assign(g.style, { position: 'absolute', left: '120px', bottom: '80px', display: 'flex', alignItems: 'baseline', gap: '22px' });
  return g;
}
function bigNum(parent, txt, x, y, size, cls = '') {
  const n = el('div', 'num ' + cls, parent); n.textContent = txt;
  Object.assign(n.style, { left: x + 'px', top: y + 'px', fontSize: size + 'px' });
  return n;
}

/* ---------- S0 · INTRO 0–4 s ------------------------------------------- */
(() => {
  tl.set('#s0', { visibility: 'hidden' }, 4.08);
  const s0 = $('#s0');
  lightPath(s0, 0, 4, 18, 20, 62, 60);
  tl.fromTo(s0, { '--lr': '350px' }, { '--lr': '1100px', duration: 4, ease: 'power1.in' }, 0);
  // minute ticks + track draw
  const mg = $('#minutes'); let mh = '';
  for (let i = 0; i < 60; i++) { const a = i * 6, big = i % 5 === 0; mh += `<line x1="0" y1="${-420}" x2="0" y2="${big ? -392 : -406}" stroke="${big ? '#e6e9ec' : 'rgba(255,255,255,.45)'}" stroke-width="${big ? 4 : 2}" transform="rotate(${a})"/>`; }
  mg.innerHTML = mh;
  const C = 2 * Math.PI * 420, track = $('#track');
  track.setAttribute('stroke-dasharray', C);
  tl.fromTo(track, { strokeDashoffset: C }, { strokeDashoffset: 0, duration: 3.9, ease: 'power2.inOut' }, 0);
  tl.fromTo('#minutes line', { opacity: 0 }, { opacity: 1, duration: .25, stagger: 3.6 / 60, ease: 'none' }, 0.1);
  // numerals ١…١٢ appear on the ticks (quarters, then eighths)
  const times = [0, .5, 1, 1.5, 2, 2.25, 2.5, 2.75, 3, 3.25, 3.5, 3.75];
  const wrap = $('#ringnums');
  times.forEach((t, k) => {
    const n = k + 1, a = n * 30 * Math.PI / 180, R = 318;
    const d = el('div', 'num', wrap); d.textContent = AR(n);
    Object.assign(d.style, { fontSize: '118px', left: (Math.sin(a) * R) + 'px', top: (-Math.cos(a) * R) + 'px', transform: 'translate(-50%,-58%)' });
    tl.fromTo(d, { opacity: 0, scale: 1.9, filter: 'blur(16px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: .32, ease: 'expo.out', immediateRender: true }, t);
  });
  // the seconds hand points at each numeral as it lands
  frameHooks.push(t => {
    if (t > 4.1) return;
    let k = 0; for (let i = 0; i < times.length; i++) if (t >= times[i]) k = i;
    const f = Math.min((t - times[k]) / 0.07, 1), ov = f < 1 ? gsap.parseEase('back.out(3)')(f) : 1;
    const prev = k === 0 ? -30 : k * 30, cur = (k + 1) * 30;
    const ang = t < 0 ? 0 : prev + (cur - prev) * ov;
    $('#ringhand').setAttribute('transform', `rotate(${ang})`);
  });
  // camera: slow rotate-in, then match-cut push toward the hero dial (pivot at 1240,540)
  tl.fromTo('#ring', { rotation: -24, scale: .86 }, { rotation: 0, scale: 1, duration: 3.75, ease: 'power2.out' }, 0);
  tl.to('#ring', { left: 1240, scale: .78, duration: .3, ease: 'power3.in' }, 3.78);
  tl.to('#ring', { opacity: 0, duration: .12 }, 3.98);
})();

/* ---------- S1 · HERO 4–6 s -------------------------------------------- */
(() => {
  show('#s1', 3.92, 6.12);
  const s1 = $('#s1');
  // match cut: the drawn numeral ring dissolves into the real dial
  tl.fromTo(s1.querySelectorAll('.bg,.relief,.glow'), { opacity: 0 }, { opacity: 1, duration: .16, ease: 'power1.inOut', immediateRender: false }, 3.92);
  const w = makeWatch('black', s1);
  const s = 0.69;
  tl.fromTo(w.el, { ...at(w, 1240, 540, s * 1.18), rotationX: 16, rotationZ: -9, opacity: 0 },
    { ...at(w, 1240, 540, s), rotationX: 0, rotationZ: 0, opacity: 1, duration: 1.6, ease: 'expo.out' }, 3.96);
  tl.to(w.el, { ...at(w, 1100, 548, s * 1.035), duration: .6, ease: 'power2.in' }, 5.56);
  sheen(w, 4.12, .9);
  lightPath(s1, 4, 6.1, 75, 20, 62, 55);
  ['#hA', '#hB'].forEach((id, i) => {
    const chs = split($(id)); chs.forEach(c => c.classList.add('metal'));
    tl.fromTo(chs, { yPercent: 115 }, { yPercent: 0, duration: .55, ease: 'expo.out', stagger: .045 }, 4.12 + i * .22);
  });
  tl.fromTo('#hRule', { scaleX: 0 }, { scaleX: 1, duration: .6, ease: 'expo.out' }, 4.7);
  tl.fromTo('#hC', { opacity: 0, letterSpacing: '20px' }, { opacity: 1, letterSpacing: '8.4px', duration: .8, ease: 'expo.out' }, 4.75);
  tl.fromTo('#hD', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .6, ease: 'expo.out' }, 4.95);
  tl.fromTo('#i1', { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .5, ease: 'expo.out' }, 5.25);
  tl.to('#heroText', { x: -60, duration: 2.2, ease: 'none' }, 4.0);
  flash(4.0, .72, .38);
})();

/* ---------- S2 · COLOUR RUN 6–10 s (+ push-in words 10–12) ------------- */
const RUN = [
  { name: 'royal',  t: 6, wipe: ['inset(0 0 0 100%)', 'inset(0 0 0 0%)'],  from: { dx: 520, dy: 0, ry: -38, rx: 0, k: 1 }, nums: [['١٢', 1350, -120, 470], ['٦', 90, 640, 420]] },
  { name: 'teal',   t: 7, wipe: ['inset(100% 0 0 0)', 'inset(0% 0 0 0)'],  from: { dx: 0, dy: 560, ry: 0, rx: 34, k: 1 },  nums: [['٣', 1430, 330, 480], ['٩', 70, -40, 440]] },

    if (w.scene && w.scene.style.visibility !== 'visible') continue;
    const a = 216 + 6 * step + w.offset;
    w.hand.setAttribute('transform', `rotate(${a.toFixed(3)} ${w.cx} ${w.cy})`);
  }
  const inDrop = (t >= 4 && t < 12) || (t >= 20 && t < 26) || (t >= 28 && t < 28.6);
  const dt = t - Math.floor(t / BEAT) * BEAT;
  const bump = inDrop ? 0.0065 * Math.exp(-dt / 0.07) : 0;
  $('#cam').style.transform = bump ? `scale(${(1 + bump).toFixed(5)})` : '';
  const fr = Math.round(t * 60);
  const g = $('#grain'); g.style.backgroundPosition = `${(fr * 137) % 384}px ${(fr * 251) % 384}px`;
});

window.seek = t => { tl.seek(t, false); for (const h of frameHooks) h(t); return t; };
window.DUR = DUR;

/* ---------- boot ------------------------------------------------------- */
(async () => {
  await Promise.all(['900 40px Archivo', '600 40px Kufi', '700 40px Amiri', '700 40px Ruqaa'].map(f => document.fonts.load(f, 'Aب١').catch(() => {})));
  await document.fonts.ready;
  const imgs = [...document.images];
  const urls = ['img/relief.png', 'img/relief_r.png', 'img/grain.png', ...ORDER.map(n => `img/watch_${n}.png`)];
  await Promise.all([...imgs.map(i => i.decode().catch(() => {})), ...urls.map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; }))]);
  seek(0);
  window.READY = true;
  if (!/render/.test(location.search)) preview();
})();

function preview() {
  document.body.classList.add('preview');
  const st = $('#stage'), fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); st.style.transform = `scale(${k})`; st.style.position = 'absolute'; st.style.left = (innerWidth - 1920 * k) / 2 + 'px'; st.style.top = (innerHeight - 1080 * k) / 2 + 'px'; };
  fit(); addEventListener('resize', fit);
  const au = new Audio('music.wav'); let playing = false;
  const hud = $('#hud'); hud.textContent = 'click / space: play · ← → : scrub';
  const loop = () => { if (playing) { seek(au.currentTime); hud.textContent = au.currentTime.toFixed(2) + ' s'; if (au.ended) playing = false; } requestAnimationFrame(loop); };
  const toggle = () => { if (playing) { au.pause(); playing = false; } else { au.play(); playing = true; } };
  addEventListener('click', toggle);
  addEventListener('keydown', e => { if (e.code === 'Space') toggle(); if (e.code === 'ArrowRight') { au.currentTime += .5; seek(au.currentTime); } if (e.code === 'ArrowLeft') { au.currentTime -= .5; seek(au.currentTime); } });
  loop();
}
</script>
